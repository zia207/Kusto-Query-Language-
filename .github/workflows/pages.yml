name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site
        run: |
          mkdir -p _site
          cp .github/workflows/index.html _site/index.html
          cp .github/workflows/index.html _site/kql_sql_nyc_taxi_tutorial.html
          cp kql_linkedin_post.html _site/kql_linkedin_post.html
          cp upatta_logo.png _site/upatta_logo.png
          cp KQL.png _site/KQL.png
          touch _site/.nojekyll
          ls -la _site/
          test -f _site/index.html
          test -f _site/kql_linkedin_post.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
